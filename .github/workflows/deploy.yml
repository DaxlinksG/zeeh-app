name: Deploy to AWS ECS

on:
  push:
    branches: [main]       # auto-deploy on every push to main
  workflow_dispatch:        # manual trigger from GitHub UI

env:
  AWS_REGION:          ca-central-1
  ECR_REPOSITORY:      zeeh-payments
  ECS_CLUSTER:         zeeh-payments
  ECS_SERVICE:         zeeh-payments-service
  ECS_TASK_DEFINITION: zeeh-payments
  CONTAINER_NAME:      zeeh-payments

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ──────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Log in to ECR ──────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build, tag, push Docker image ──────────────────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── 5. Get current ECS task definition ────────────────────────────────
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      # ── 6. Update image in task definition ────────────────────────────────
      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ env.CONTAINER_NAME }}
          image:            ${{ steps.build-image.outputs.image }}

      # ── 7. Deploy new task definition to ECS ─────────────────────────────
      - name: Deploy to ECS (rolling update, zero downtime)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:  ${{ steps.task-def.outputs.task-definition }}
          service:          ${{ env.ECS_SERVICE }}
          cluster:          ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true   # wait until healthy before reporting success

      # ── 8. Smoke test ─────────────────────────────────────────────────────
      - name: Smoke test — health check
        run: |
          sleep 10
          curl -sf https://api.zeehfi.ca/health | grep '"status":"ok"' \
            && echo "✅ Deployment healthy" \
            || echo "⚠️  Health check failed — check ECS logs"
